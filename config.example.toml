# Copy to ~/.config/thermaltaked/config.toml. Every key is optional.

# Seconds between frames. The panel returns to its own screen when a few of
# them go by without one, so anything above two seconds is brought back to two.
refresh_seconds = 1.0
brightness = 100    # 0..100

# Show only the date and time while the monitors are off or the session is
# locked, instead of the dashboard.
clock_when_away = true

# Give the panel over to whatever is playing, for as long as it plays. Any
# player that speaks MPRIS will do: Deezer, Spotify, a browser, a local player.
show_player = true

# font_regular = "/usr/share/fonts/dejavu-sans-fonts/DejaVuSans.ttf"
# font_bold = "/usr/share/fonts/dejavu-sans-fonts/DejaVuSans-Bold.ttf"

# Rated wattage of the power supply, for its load bar. Read from the model
# name when left out (HX1200i: 1200 W).
# psu_rating = 1200

[weather]
city = "Paris"          # resolved through Open-Meteo; remove to disable weather
refresh_minutes = 15

# Gauge titles. Detected from the hardware when left out; names too long for
# their column lose their leading words.
[names]
# cpu = "Ryzen 9"
# gpu = "RX 9070 XT"
# psu = "HX1200i"

# Fan names, keyed by "<hwmon chip>/<fanN>" (see /sys/class/hwmon/*/name).
# Left empty, every spinning fan is shown; otherwise only the listed ones.
[fans]
# "nct6799/fan1" = "front"
# "amdgpu/fan1" = "gpu"
