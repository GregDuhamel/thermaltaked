[package]
name = "thermaltaked"
version = "0.5.0"
edition = "2024"
# let-chains, used throughout, landed in 1.88.
rust-version = "1.88"
description = "Driver and dashboard daemon for the Thermaltake 3.9\" bar LCD (264a:233d) on Linux"
repository = "https://github.com/GregDuhamel/thermaltaked"
license = "GPL-3.0-or-later"
readme = "README.md"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
imageproc = { version = "0.27.0", default-features = false, features = ["text"] }
# The hidraw transport: sysfs discovery, output reports, poll with timeout,
# and telling an unplugged panel from a transient error. Not on crates.io.
hidraw = { git = "https://github.com/GregDuhamel/hidraw", tag = "v0.1.0" }
indexmap = { version = "2.14.2", features = ["serde"] }
# `getuid(2)`, which std does not wrap, to find this user's logind session.
rustix = { version = "1.1.5", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
signal-hook = "0.4.4"
thiserror = "2.0.20"
# The parser goes through a table before it reaches `Config`, so without
# `preserve_order` the fans would come out sorted rather than as written.
toml = { version = "1.1.6", features = ["preserve_order"] }
ureq = { version = "3.4.2", features = ["json"] }
zbus = "5.19.0"

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"

[profile.release]
strip = true
lto = "thin"
panic = "abort"

[lints.rust]
# The system calls go through hidraw and rustix, which wrap them safely.
unsafe_code = "deny"

# The crate is a library with a binary on top, so its public API is held to
# the pedantic set, which keeps it documented as one.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
