name: Release

# Tags and publishes whatever version Cargo.toml carries. Bumping that version
# is an ordinary pull request, since main takes no direct pushes.
on:
  workflow_dispatch:

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "no version in Cargo.toml" >&2
            exit 1
          fi
          if git tag --list "v$version" | grep -q .; then
            echo "v$version is already released: bump the version in Cargo.toml first" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --locked --all-targets

      - name: cargo build --release
        run: cargo build --locked --release

      - name: Tag the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Rename binary
        run: cp target/release/thermaltaked thermaltaked-x86_64-linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: |
            thermaltaked-x86_64-linux
            udev/70-thermaltake-lcd.rules
            systemd/thermaltaked.service
            config.example.toml
          generate_release_notes: true
